[project]
name = "bureau"
version = "0.1.0"
description = "Multi-agent AI orchestration framework"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.2.0",
    "pqdict>=1.3",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "tomlkit>=0.12",
]

[project.scripts]
bureau-dossiers = "operations.dossiers.cli:main"
get-config = "operations.config_cli:main"
sweep = "operations.cleanup.core:main"
validate-config = "operations.validate_config:main"
concierge-bot = "concierge.bridge.telegram:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["operations*", "concierge*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "responses>=0.25",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "transformers>=4.30",
    "onnx>=1.14",
    "onnxscript>=0.1",
    "onnxruntime>=1.15",
    "numpy>=1.24",
]
telegram = [
    "python-telegram-bot[rate-limiter]>=22.0",
]

[tool.mypy]
python_version = "3.13"
packages = ["concierge"]
strict = true
warn_return_any = true
warn_unused_configs = true

# ML optional dependencies lack type stubs
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "onnxruntime.*",
    "numpy.*",
]
ignore_missing_imports = true

# python-telegram-bot: optional dependency, no type stubs
[[tool.mypy.overrides]]
module = "telegram.*"
ignore_missing_imports = true

# operations/ is checked transitively via imports; not yet strict-ready
[[tool.mypy.overrides]]
module = "operations.*"
follow_imports = "silent"

# Tests: enforce type correctness but relax annotation requirements on fixtures/helpers
[[tool.mypy.overrides]]
module = "concierge.tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false
strict_equality = false
disallow_any_generics = false

# ML training script: heavily uses untyped third-party APIs (torch, transformers)
[[tool.mypy.overrides]]
module = "concierge.classifier.train"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = [
    "operations/cleanup/tests",
    "operations/tests",
    "protocols/scripts/tests",
    "tools/scripts/tests",
    "concierge/tests",
]
pythonpath = ["."]
