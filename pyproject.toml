[project]
name = "bureau"
version = "0.1.0"
description = "Multi-agent AI orchestration framework"
requires-python = ">=3.13"
dependencies = [
    "pqdict>=1.3",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "tomlkit>=0.12",
]

[project.scripts]
get-config = "operations.config_cli:main"
sweep = "operations.cleanup.core:main"
validate-config = "operations.validate_config:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["operations*", "concierge*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "responses>=0.25",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "transformers>=4.30",
    "onnx>=1.14",
    "onnxscript>=0.1",
    "onnxruntime>=1.15",
    "numpy>=1.24",
]

[tool.mypy]
python_version = "3.13"

[tool.pytest.ini_options]
testpaths = [
    "operations/cleanup/tests",
    "operations/tests",
    "protocols/scripts/tests",
    "tools/scripts/tests",
    "concierge/tests",
]
pythonpath = ["."]
