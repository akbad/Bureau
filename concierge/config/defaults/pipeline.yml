media:
  max_processing_time_seconds: 30
  acknowledgment_after_seconds: 3
  max_reentry_count: 1

session:
  timeout_minutes: 10
  message_batch_window_seconds: 15

context_budget:
  max_tokens: 4000

background:
  schedule_hours: [6, 14]
  max_execution_minutes: 5
  max_llm_calls_per_run: 2

telegram:
  # token loaded from BUREAU_TELEGRAM_TOKEN env var (never from config files)
  polling_timeout: 30  # seconds between long-poll requests
  typing_indicator: true  # send "typing..." while processing
  max_response_length: 4096  # Telegram message limit
